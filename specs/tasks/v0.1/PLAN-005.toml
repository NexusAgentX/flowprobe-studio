definition_of_done = ["PLAN-005 and GOV-003 are the only added paths, both are regular mode-100644 TOML files, and the trusted-base planning bootstrap accepts their merged DAG", "GOV-003 depends on PLAN-005 and GOV-002 and authorizes changes only to specs/tasks/v0.1/GOV-001.toml and docs/development/TASK_CONTRACT.md", "GOV-003 contains a fail-closed unique-merge-base, exact-path, mode, base-hash, and target-hash predicate that rejects any repository transformation other than the independently reviewed approval-policy correction", "The final policy keeps strict=true and exactly contracts, Rust workspace, Desktop renderer, and Task scope (trusted base) bound to GitHub Actions app_id 15368, keeps administrator enforcement, read-only non-approving Actions, and the force-push and deletion prohibitions, while required_pull_request_reviews is absent or null", "The planning contract preserves CODEOWNERS and its trust boundary, forbids FlowProbe automation and task execution from explicitly requesting or re-requesting GitHub reviews, and does not falsely claim that retaining CODEOWNERS can guarantee the absence of GitHub-generated owner notifications", "The positive canary must prove two consecutive exact heads are blocked until all four current-SHA checks pass and then become eligible without approval, requested reviewers and submitted reviews are empty at every recorded state, and its complete timeline contains no review_requested or review_request_removed event; all existing negative fail-closed canaries remain required", "The user-authorized remote bootstrap is recorded only as external pre/post API evidence; this planning pull request changes no existing contract, documentation, workflow, CODEOWNERS file, implementation, accepted architecture artifact, or remote repository setting", "The planning pull request body contains exactly one unquoted Task ID: PLAN-005 line accepted by the trusted-base parser and creates no GitHub review request", "An independent technical reviewer reports no P0-P2 issue in the scope, dependency order, byte-exact authorization, notification boundary, canaries, or retained machine controls without submitting a GitHub approval"]
