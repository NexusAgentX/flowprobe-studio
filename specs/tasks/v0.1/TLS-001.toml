id = "TLS-001"
milestone = "v0.1"
title = "Prove TLS interception with a generated local CA"
goal = "Implement and prove a generic minimum TLS interception boundary that generates a local root CA, terminates a trusted client TLS session, relays to an independently verified loopback TLS origin, and supplies genuinely decrypted HTTP bytes to Capture Core."
depends_on = ["PLAN-001", "CAP-001", "INT-001"]
allowed_paths = ["Cargo.toml", "Cargo.lock", "crates/capture-core/**", "tests/fixtures/tls/**", "tests/integration/v0_1/**", "docs/milestones/v0.1.md"]
forbidden_paths = ["PRODUCT.md", "ARCHITECTURE.md", "docs/adr/**", "docs/contracts/**", "apps/**", "runtime/singbox/**", "crates/config-compiler/**", "crates/runtime-api/**", "crates/storage/**", "crates/analyzer-runtime/**", "crates/plugin-sdk/**", "plugins/**", "scripts/**", ".github/**", "tests/fixtures/golden/**"]
acceptance = ["cargo fmt --all -- --check", "cargo test -p flowprobe-capture-core --locked", "cargo clippy -p flowprobe-capture-core --all-targets --locked -- -D warnings", "cargo test --workspace --locked", "cargo clippy --workspace --all-targets --locked -- -D warnings", "cargo test --manifest-path tests/integration/v0_1/Cargo.toml --locked --test tls_interception_proof", "cargo clippy --manifest-path tests/integration/v0_1/Cargo.toml --locked --all-targets -- -D warnings", "RUSTDOCFLAGS=-Dwarnings cargo doc -p flowprobe-capture-core --locked --no-deps", "python scripts/check_v0_1_integration.py", "python scripts/validate_tasks.py", "python scripts/quality_gate.py"]
definition_of_done = ["Production code under crates/capture-core owns and exposes the generic interception boundary exercised by the integration proof: generated-CA and leaf issuance, client TLS termination, separately authenticated upstream TLS relay, and delivery of decrypted directional bytes; the test target owns only loopback clients and origins", "The integration proof obtains the interception result, negotiated TLS version, ALPN, and decrypted request/response bytes from that production boundary and does not manually construct TlsInterception::Intercepted or substitute fixture plaintext", "The generated local root CA issues a distinct leaf certificate with the requested local test hostname in SAN", "A client that trusts only the generated FlowProbe CA completes a real TLS handshake with the interceptor, while an untrusted client and a wrong-SNI client fail closed", "The interceptor relays to a loopback TLS origin whose independently trusted certificate is not the interception leaf", "The loopback origin observes the exact request once and upstream certificate verification failure aborts the relay", "Wire ClientHello bytes and genuinely decrypted request and response bytes produce an HTTPS NormalizedFlow with intercepted TLS metadata", "CA and leaf private keys remain local and in memory, are not rendered by Debug or logs, and no real secret enters a fixture", "The proof changes no system trust store, TUN, proxy setting, or external network endpoint", "New TLS and cryptography dependencies are minimal, locked, and documented in the PR with versions, licenses, shipped-binary impact, and attribution obligations"]
