id = "GOV-001"
milestone = "v0.1"
title = "Enforce trusted repository governance for v0.1"
goal = "Make main fail closed against untrusted pull-request code by isolating trusted-base and proposed-head check contexts, binding required checks to GitHub Actions, requiring independent code-owner review, and hardening GitHub Actions permissions within the explicit trust boundary of organization owners and repository administrators."
depends_on = ["PLAN-003", "INT-003"]
allowed_paths = [".github/pull_request_template.md", ".github/CODEOWNERS", ".github/workflows/contract.yml", ".github/workflows/task-scope-trusted.yml", "docs/development/TASK_CONTRACT.md"]
forbidden_paths = ["AGENTS.md", "PRODUCT.md", "ARCHITECTURE.md", "ROADMAP.md", "docs/adr/**", "docs/contracts/**", "docs/milestones/**", "specs/tasks/**", "specs/nonconformance/**", "apps/**", "crates/**", "runtime/**", "plugins/**", "tests/**", "scripts/**", "Cargo.toml", "Cargo.lock", "package.json", "pnpm-lock.yaml", "mise.toml"]
acceptance = ["python -B scripts/validate_tasks.py", "python -B -m unittest discover -s scripts/tests -p 'test_task_scope.py'", "python -B scripts/quality_gate.py", "python -B scripts/check_task_scope.py audit --ledger specs/nonconformance/v0.1/task-scope.toml", "python -B scripts/check_task_scope.py check --task GOV-001 --base-ref origin/main --head-ref HEAD", "python -B scripts/check_v0_1_integration.py", "mise run check", "git diff --check", "gh api repos/NexusAgentX/flowprobe-studio/branches/main/protection", "gh api repos/NexusAgentX/flowprobe-studio/actions/permissions", "gh api repos/NexusAgentX/flowprobe-studio/actions/permissions/selected-actions", "gh api repos/NexusAgentX/flowprobe-studio/actions/permissions/workflow", "gh api -H 'X-GitHub-Api-Version: 2026-03-10' 'repos/NexusAgentX/flowprobe-studio/codeowners/errors?ref=refs%2Fheads%2Fmain' --jq '.errors == []' | grep -qx true"]
definition_of_done = [
    "The pull-request template emits exactly one unquoted Task ID: XXX-000 line that the trusted-base parser accepts after replacement; backticks, code fences, duplicate identities, and ambiguous instructions are absent",
    "A base-branch .github/CODEOWNERS file assigns every path and .github itself to @faithleysath, @Howardzhangdqs, and @Mieluoxxx; the live collaborator and organization APIs confirm that every listed owner still has repository write/admin authority and is inside the trusted owner/admin boundary, and the CODEOWNERS errors API returns no errors",
    "The ordinary contract workflow listens only to pull_request and main push events and is the sole producer of contracts, Rust workspace, and Desktop renderer; a separate trusted workflow uses exactly pull_request_target activity types opened, synchronize, reopened, and edited for base branch main and is the sole producer of Task scope (trusted base), so target events cannot create same-name skipped-success substitutes for proposed-head checks",
    "Every workflow has explicit contents: read permissions, grants no write or pull-request approval permission, pins every third-party action to a verified full commit SHA, checks out only trusted base code in pull_request_target, and never checks out or executes pull-request head code in the trusted context; the trusted required job is created on every covered event without a job-level condition or continue-on-error, and its scope-enforcement step cannot be skipped, neutralized, or made conditional",
    "After the repository-file pull request is merged, a trusted administrator sets repository Actions defaults to read with pull-request review approval disabled, sets enabled=true, allowed_actions=selected, and sha_pinning_required=true, and configures github_owned_allowed=false, verified_allowed=false, and selected patterns actions/checkout@*, actions/setup-python@*, actions/setup-node@*, dtolnay/rust-toolchain@*, and pnpm/action-setup@*",
    "After the workflows are present on main, a trusted administrator protects main with strict required status checks contracts, Rust workspace, Desktop renderer, and Task scope (trusted base), each bound to GitHub Actions app_id 15368; one approving review and code-owner review are required, stale approvals are dismissed, the latest push requires approval by someone other than its pusher, administrators are enforced, bypass allowances are empty, and force pushes and branch deletion are disabled",
    "Live API evidence captured after configuration shows the exact branch-protection checks and app IDs, strict=true, enforce_admins=true, required_approving_review_count=1, require_code_owner_reviews=true, dismiss_stale_reviews=true, require_last_push_approval=true, empty bypasses, allow_force_pushes=false, allow_deletions=false, and the exact Actions and CODEOWNERS settings; no committed file is presented as remote-settings state",
    "A positive canary pull request on the protected main branch uses exact GOV-001 identity and an allowed disposable change, proves all four required checks are successful on its exact head SHA from app_id 15368, is blocked before an independent code-owner approval, becomes eligible after approval, is blocked again after a new push invalidates that approval, and becomes eligible only after a different trusted owner approves the last push",
    "Negative canaries first obtain a successful trusted check for an exact task identity, then change only the pull-request body on the same head SHA to a backticked or otherwise non-exact identity and prove that the edited event creates a new blocking failure and leaves the pull request unmergeable despite the earlier successful trusted check on that same SHA; a separate out-of-scope path also fails Task scope (trusted base) and remains unmergeable",
    "A same-app same-name spoof canary changes only an allowed proposed-head workflow path to emit a successful Task scope (trusted base) check from a pull_request run while the real pull_request_target trusted-base check fails on the same exact head SHA; after every other branch-protection condition is satisfied, check-run and Actions-run APIs prove both checks use GitHub Actions app_id 15368 but originate from distinct workflow paths and events, and classic branch protection remains blocking despite the forged success",
    "A proposed-head failure canary makes contracts fail while Task scope (trusted base) succeeds; the head check-run API shows no pull_request_target-created contracts, Rust workspace, or Desktop renderer skipped-success duplicate, and branch protection remains blocking",
    "All canary pull requests are closed unmerged, their temporary branches are deleted, and no canary commit, file, workflow change, review bypass, or remote setting outside this task remains",
    "The repository change may merge before remote enforcement is applied, but GOV-001 and the v0.1 release remain incomplete until the API snapshots, canaries, exact merged-main v0.1 re-verification, and an independent P0-P2-zero review are recorded",
    "The documented threat model does not claim protection from a malicious or compromised NexusAgentX organization owner or repository administrator, because those trusted actors can change CODEOWNERS, workflows, and remote protection settings",
]
