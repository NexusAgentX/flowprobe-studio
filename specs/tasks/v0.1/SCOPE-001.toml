id = "SCOPE-001"
milestone = "v0.1"
title = "Correct and prevent task path-scope nonconformance"
goal = "Record the exact historic v0.1 path-scope nonconformance, explicitly adopt the necessary current root build state through a corrective task, and enforce literal task allowed_paths and forbidden_paths for future pull requests without changing the original task contracts."
depends_on = ["PLAN-002", "INT-002"]
allowed_paths = ["Cargo.toml", "Cargo.lock", "mise.toml", "pnpm-lock.yaml", "specs/nonconformance/v0.1/**", "scripts/check_task_scope.py", "scripts/tests/test_task_scope.py", ".github/workflows/contract.yml", "docs/development/TASK_CONTRACT.md", "specs/tasks/README.md", "docs/milestones/v0.1.md"]
forbidden_paths = ["AGENTS.md", "PRODUCT.md", "ARCHITECTURE.md", "ROADMAP.md", "docs/adr/**", "docs/contracts/**", "specs/tasks/**", "apps/**", "crates/**", "runtime/**", "plugins/**", "tests/**", "scripts/check_v0_1_integration.py"]
acceptance = ["python -B scripts/validate_tasks.py", "python -B -m unittest discover -s scripts/tests -p 'test_task_scope.py'", "python -B scripts/check_task_scope.py audit --ledger specs/nonconformance/v0.1/task-scope.toml", "python -B scripts/check_task_scope.py check --task SCOPE-001 --base-ref origin/main --head-ref HEAD", "python -B scripts/quality_gate.py", "cargo metadata --locked --format-version 1 --no-deps", "pnpm install --frozen-lockfile", "mise run check", "git diff --check"]
definition_of_done = ["A machine-verifiable ledger pins every affected task and pull request, full base/head/merge commit identities, all fifteen historic out-of-scope path instances, old and new blob identities, task relevance, disclosure evidence, and the literal allowed/forbidden decision", "The ledger and documentation say historic nonconformance corrected and closed; they do not claim that the affected pull requests complied at merge time", "The current Cargo.toml, Cargo.lock, pnpm-lock.yaml, and mise.toml state is independently checked, shown necessary for the task implementations or reproducible toolchain, and explicitly adopted by SCOPE-001 without meaningless content churn", "A trusted-base pull-request gate requires exactly one task ID and rejects every added, modified, deleted, copied, or renamed path that is outside allowed_paths or inside forbidden_paths", "The pull-request gate has no implicit exception for supporting manifests, lockfiles, or mise files and fails closed for missing history, missing or ambiguous task identity, unknown contracts, malformed contracts, invalid paths, and unreadable Git state", "A safe planning bootstrap may add only new task-contract TOML files; ordinary implementation contracts are read from the trusted base revision so the same pull request cannot widen its own scope", "Deterministic tests replay all fifteen historic instances, detect ledger deletion or mutation, cover rename and delete paths, forbidden-over-allowed precedence, missing and multiple task IDs, unknown tasks, same-PR contract widening, gate modification, and a valid task with explicitly allowed root files", "CI and mise run the scope self-tests, historic ledger audit, existing task validation, existing anti-shortcut gate, and ordinary project checks", "The original thirteen v0.1 task contracts and accepted architecture artifacts remain unchanged", "An independent reviewer finds no P0-P2 issue in the corrective ledger, gate, tests, CI integration, or adopted root build state"]
