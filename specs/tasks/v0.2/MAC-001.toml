id = "MAC-001"
milestone = "v0.2"
title = "Implement the selected macOS native network backend"
goal = "Implement every exact macOS tuple selected by ARCH-007, or retain and prove the fail-closed typed Unsupported backend when no macOS tuple was selected, while preserving the independent sing-box process boundary."
depends_on = ["ARCH-007", "BACKEND-001", "CA-001"]
allowed_paths = ["crates/platform-macos/**"]
forbidden_paths = ["AGENTS.md", "PRODUCT.md", "ARCHITECTURE.md", "ROADMAP.md", "docs/**", "specs/**", "apps/**", "crates/platform-windows/**", "crates/platform-linux/**", "crates/runtime-api/**", "crates/supervisor/**", "runtime/**", "plugins/**", "tests/**", "scripts/**", ".github/**", "Cargo.toml", "Cargo.lock", "package.json", "pnpm-lock.yaml", "mise.toml"]
acceptance = [
    "cargo fmt --manifest-path crates/platform-macos/Cargo.toml -- --check",
    "cargo clippy --manifest-path crates/platform-macos/Cargo.toml --all-targets --locked -- -D warnings",
    "cargo test --manifest-path crates/platform-macos/Cargo.toml --all-targets --locked",
    "python -B scripts/validate_tasks.py",
    "python -B scripts/check_task_scope.py check --task MAC-001 --base-ref origin/main --head-ref HEAD",
    "python -B scripts/quality_gate.py",
    "python -B scripts/check_task_scope.py audit --ledger specs/nonconformance/v0.1/task-scope.toml",
    "mise run check",
    "git diff --check origin/main...HEAD",
