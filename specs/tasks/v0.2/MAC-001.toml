definition_of_done = [
    "If ARCH-007 selected macOS rows, the crate implements exactly those release, architecture, signing and distribution tuples and returns typed Unsupported elsewhere; if none was selected, it performs zero OS mutation and the typed Unsupported conformance suite passes",
    "The package is a temporary standalone Cargo workspace with its own committed lockfile, depends only on the neutral BACKEND-001 API plus target-specific libraries, and does not depend on Supervisor or CA lifecycle or modify root workspace files",
    "The backend preserves independent managed sing-box and helper processes and does not substitute an embedded libbox Network Extension, undocumented API, PID, utun name or whole-network snapshot for stable authority and rollback evidence",
    "TUN attachment, route and DNS compare-before-restore, process exclusion, first-packet release, normal stop, helper or engine death, sleep or resume, restart and boot recovery preserve the ordinary-connectivity oracle under deterministic fault injection",
    "User or Admin trust mutation occurs only through the selected authenticated context and exact certificate and trust-settings identity; the generic helper never receives a CA private key or foreground-admin authority",
    "Native calls are behind injectable traits, non-macOS builds compile and test the typed unsupported boundary, and no fake backend can report a real host Ready",
    "No accepted architecture, milestone, unrelated platform backend, compatibility shim, migration layer, requested reviewer or approval is changed or created",
]
