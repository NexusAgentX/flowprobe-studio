    "The gate requires at least one SupportedByDesign, Ready and RealHostVerified exact row on each of Windows, Linux and macOS; missing platform coverage fails and cannot be treated as an empty all-selected set",
    "Start, stop, concurrent intent, engine crash, helper crash, UI crash, lease expiry, watchdog takeover, boot recovery and external drift cannot leave a selected test host without the recorded ordinary-connectivity oracle",
    "Built-in direct and local external HTTP, HTTPS and SOCKS5 paths exercise requested IPv4, IPv6, UDP and DNS policy without recursion or silent direct fallback; unsupported combinations remain explicit",
    "Persistent CA install and uninstall are verified independently from network-session stop and no release claim is made for an unselected trust target or TLS consumer",
    "The v0.2 milestone records exact supported tuples, explicit unsupported rows, deterministic versus privileged evidence, current commit identity, commands and results without changing the objective or erasing limitations",
    "Required CI runs the hermetic integration gate; privileged evidence remains a separately authenticated release input and cannot be replaced by a skipped, neutral or fake-host job",
    "The release pull request contains exactly one unquoted Task ID: INT-004 line, creates no requested reviewer or approval, all required checks pass, and independent security and release reviewers report P0-P2 zero",
