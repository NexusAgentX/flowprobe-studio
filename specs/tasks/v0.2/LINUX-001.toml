definition_of_done = [
    "If ARCH-007 selected Linux rows, the crate implements exactly those distribution, release, architecture, kernel, init, resolver, network manager and package tuples and returns typed Unsupported elsewhere; if none was selected, it performs zero OS mutation and the typed Unsupported conformance suite passes",
    "The package is a temporary standalone Cargo workspace with its own committed lockfile, depends only on the neutral BACKEND-001 API plus target-specific libraries, and does not depend on Supervisor or CA lifecycle or modify root workspace files",
    "TUN, route, rule, firewall, DNS and process-exclusion operations use stable FlowProbe ownership identities, journaled before and after observations, compare-before-restore and bounded recovery without treating interface names or process IDs as durable identity",
    "External runtime attachment, first-packet release, normal stop, helper or engine death, stale owner, restart and boot recovery preserve the ordinary-connectivity oracle under deterministic fault injection",
    "System trust and any selected NSS target use exact source, derived artifact, regenerator, database and consumer identities; generic bundle edits, HOME discovery and whole-database restore are impossible",
    "Native calls are behind injectable traits, non-Linux builds compile and test the typed unsupported boundary, and no fake backend can report a real host Ready",
    "No accepted architecture, milestone, unrelated platform backend, compatibility shim, migration layer, requested reviewer or approval is changed or created",
]
