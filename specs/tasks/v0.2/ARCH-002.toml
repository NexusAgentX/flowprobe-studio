definition_of_done = [
    "ADR-0005 is accepted and its contract defines a tagged egress model for Direct, ExternalHttp, ExternalHttps, and ExternalSocks5 without silent mode substitution",
    "HTTP CONNECT, HTTPS proxy trust, SOCKS5 name-resolution and UDP-associate behavior, IPv4 and IPv6 behavior, bounded timeouts, authentication inputs, secret-safe diagnostics, and explicit unsupported results are unambiguous",
    "Pre-activation validation proves the selected egress path rather than only config syntax, has no mandatory cloud dependency, cannot recurse through the pending TUN, and reports a bounded typed result without captured credentials or response bodies",
