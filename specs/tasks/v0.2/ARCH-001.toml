id = "ARCH-001"
milestone = "v0.2"
title = "Define transactional system-network ownership and recovery"
goal = "Define the shared fail-safe lifecycle, privilege, journal, watchdog, capability, and supported-platform architecture for system-wide networking without coupling Capture Core to sing-box or granting the renderer ambient privilege."
