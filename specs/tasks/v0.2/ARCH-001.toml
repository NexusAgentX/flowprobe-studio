definition_of_done = [
    "ADR-0004 is accepted and the network-session and privileged-helper contracts are normative for v0.2; all three preserve the frozen independent sing-box process, protocol-oriented Capture Core, protected config overlay, WASM analyzer, and source-versus-derived-data boundaries",
    "The decision assigns one unprivileged orchestration owner, keeps renderer requests behind typed IPC, keeps sing-box behind NetworkRuntime, and limits the privileged helper or watchdog to authenticated, allowlisted operating-system mutations rather than arbitrary commands, paths, or renderer-controlled payloads",
    "The contract defines a generation-fenced single-writer network-session state machine with preflight, baseline discovery, config and egress validation, internal-service start, durable pre-mutation journal, TUN route and DNS activation, end-to-end health, commit, stop, reverse rollback, crash recovery, boot recovery, and terminal safe states",
    "Every mutating step has an idempotency rule, an observable success predicate, a bounded failure result, and a compensating action; recovery removes only FlowProbe-owned state and cannot silently overwrite unrelated user or administrator changes made after baseline discovery",
    "The commit point, durable journal authority, watchdog lease and fencing behavior, stale-owner handling, concurrent start or stop behavior, helper or engine crash behavior, and restart reconciliation are unambiguous and testable with deterministic fake backends and failure injection at every mutation boundary",
    "Before each mutation is issued, the durable journal fsyncs generation, lease, backend kind, resource owner, the normalized before image, intended postcondition and discoverable stable identity; after success and before any dependent mutation or commit it fsyncs the normalized observed after image",
    "A crash between mutation and after-image persistence is reconciled from stable ownership identity and intended postcondition; rollback compares only normalized FlowProbe-owned fields, restores or removes only matching managed state, and otherwise preserves external drift in an explicit recovery-required state",
    "Capabilities distinguish static support, current readiness, missing permission, temporarily unavailable state, and unsafe or unsupported operation; degradation preserves ordinary connectivity and never reports a requested network session as active when activation was refused or recovery remains incomplete",
    "The shared contracts define resource identities and extension points that ARCH-002 can use for loop exclusion, ARCH-003 can use for trust-store mutations, and ARCH-004 can use for route or DNS ownership without pre-deciding those tasks' domain-specific behavior",
    "A platform matrix covers Windows, macOS, and Linux authority, packaging or deployment, TUN, route and DNS mutation, process identity, loop exclusion, trust store, watchdog and boot recovery, plus typed unsupported cases; the macOS choice explicitly compares a Mac App Store app extension, a notarized Developer ID system extension, and a privileged native backend with their entitlements, signing, user approval and data-path boundaries using primary Apple and sing-box evidence",
    "The macOS decision cannot count an upstream Apple client that embeds libbox inside a Network Extension as evidence for FlowProbe's frozen independent managed-process boundary, cannot depend on private API or undocumented key-value access, and must either select a supported independent-process backend with complete recovery semantics or report the requested mode as unsupported pending a separately authorized architecture change",
    "Network Extension packet-flow, transparent-proxy flow, and native utun or route backends are modeled as distinct authority and data-path choices; destructive route replacement or cleanup without a captured before-image cannot satisfy transactional rollback merely because an upstream implementation starts successfully",
    "The platform resource model does not treat Windows IfIndex, macOS utun names, Linux interface names, process IDs, service restarts, systemd restarts, or SCM failure actions as durable identity or rollback evidence; it defines stable platform identity and boot reconciliation for every separately owned adapter, session, route, rule, firewall, DNS and TUN resource",
    "Supported-host acceptance defines ordinary-connectivity oracles before, during, after stop, and after injected engine, helper, and UI crashes; it requires real privileged start, stop, rollback, stale-journal and boot recovery tests on each claimed platform in addition to deterministic unprivileged tests",
    "Because FlowProbe is unreleased, the architecture directly replaces internal v0 scaffolding and forbids compatibility shims and migration code; compatibility or migration may be introduced only by a separate task after the user explicitly requests production compatibility or migration",
    "No implementation, test fixture, workflow, existing accepted ADR or contract, milestone claim, dependency, manifest, lockfile, or task contract changes in ARCH-001",
    "The architecture pull request body contains exactly one unquoted Task ID: ARCH-001 line, uses an architecture-prefixed title, all current-head machine checks pass, and no GitHub review request or approval is created",
    "An independent security and architecture reviewer reports P0, P1, and P2 all zero and confirms that shared ownership, state, failure, recovery, capability, platform support, and verification semantics are sufficient for ARCH-002 through ARCH-004",
]
