    "ADR-0007 is accepted and its contract defines a generic datagram-flow identity, original destination, direction, packet and byte counts, timing and idle closure, process provenance, bounded metadata, pass-through and explicit unavailable states without promising payload decoding or reassembly",
    "DNS metadata defines query and response correlation, name, type, class, response code, transport, resolver, timing and truncation with privacy, retention and redaction rules",
    "Observed, inferred, opaque and unavailable states are distinguishable, and encrypted DNS or QUIC traffic is not reported as visible DNS unless a supported decoder actually observed it",
