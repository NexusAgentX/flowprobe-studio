id = "GOV-004"
milestone = "v0.2"
title = "Remove CODEOWNERS automatic review requests"
goal = "Remove the repository CODEOWNERS source that GitHub automatically turns into human review requests, reconcile the machine-check-only governance contract and operator documentation, and prove that future pull requests create no requested reviewer or review-request timeline event."
depends_on = ["PLAN-006", "GOV-003"]
allowed_paths = [".github/CODEOWNERS", "specs/tasks/v0.1/GOV-001.toml", "docs/development/TASK_CONTRACT.md"]
forbidden_paths = ["AGENTS.md", "PRODUCT.md", "ARCHITECTURE.md", "ROADMAP.md", "docs/adr/**", "docs/contracts/**", "docs/milestones/**", "specs/tasks/README.md", "specs/tasks/v0.1/GOV-002.toml", "specs/tasks/v0.1/GOV-003.toml", "specs/tasks/v0.2/PLAN-006.toml", "specs/tasks/v0.2/ARCH-001.toml", "specs/tasks/v0.2/ARCH-002.toml", "specs/tasks/v0.2/ARCH-003.toml", "specs/tasks/v0.2/ARCH-004.toml", "specs/tasks/v0.2/GOV-004.toml", "specs/nonconformance/**", "apps/**", "crates/**", "runtime/**", "plugins/**", "tests/**", "scripts/**", ".github/pull_request_template.md", ".github/workflows/**", "Cargo.toml", "Cargo.lock", "package.json", "pnpm-lock.yaml", "mise.toml"]
acceptance = [
    "python -B scripts/validate_tasks.py",
    "python -B -m unittest discover -s scripts/tests -p 'test_task_scope.py'",
    "python -B scripts/quality_gate.py",
    "python -B scripts/check_task_scope.py audit --ledger specs/nonconformance/v0.1/task-scope.toml",
    "python -B scripts/check_task_scope.py check --task GOV-004 --base-ref origin/main --head-ref HEAD",
    '''python -B -c 'import hashlib, os, subprocess, sys; env=os.environ | {"GIT_NO_REPLACE_OBJECTS":"1","LC_ALL":"C"}; run=lambda *a: subprocess.check_output(["git","--no-replace-objects",*a],env=env); bases=run("merge-base","--all","origin/main","HEAD").decode().splitlines(); len(bases)==1 or sys.exit("expected exactly one merge base"); base=bases[0]; deleted=".github/CODEOWNERS"; expected={deleted:("48ec5aba25acfb3dc36d8c805be95915e14a5ff94541115d0bdd649e832938c3",None),"specs/tasks/v0.1/GOV-001.toml":("5e2072785b8aecafaa6a8472487ab1d4cc70e22f1ace38b2d0ea076d742ea9a8","67be4e9a1a8544b3fabf4dc294e7ffd40e9c741fb011ac2139acf0b148c8d19a"),"docs/development/TASK_CONTRACT.md":("691d1789fc570fc2b7591c31edb8ac14bf967d92ad3b0d56229fb7cc8efde8bb","5ebb0bdcb2d2b64051bacc5a9cfe9b66df177c9e589ac40a721ca78db1593835")}; changed={p.decode() for p in run("diff","--no-ext-diff","--no-textconv","--no-renames","--name-only","-z",base,"HEAD").split(b"\0") if p}; changed==set(expected) or sys.exit("unexpected changed path set"); mode=lambda r,p: run("ls-tree",r,"--",p).split(None,2)[:2]==[b"100644",b"blob"]; all(mode(base,p) for p in expected) or sys.exit("expected regular mode-100644 base blobs"); all(mode("HEAD",p) for p in expected if p!=deleted) or sys.exit("expected regular mode-100644 target blobs"); run("ls-tree","HEAD","--",deleted)==b"" or sys.exit("CODEOWNERS must be absent from target"); digest=lambda r,p: hashlib.sha256(run("cat-file","blob",r+":"+p)).hexdigest(); all(digest(base,p)==h[0] for p,h in expected.items()) or sys.exit("unauthorized base bytes"); all(digest("HEAD",p)==h[1] for p,h in expected.items() if h[1] is not None) or sys.exit("unauthorized target bytes")' ''',
    "test ! -e .github/CODEOWNERS",
    '''set -o pipefail; gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/NexusAgentX/flowprobe-studio/branches/main/protection --jq '(.required_status_checks.strict == true) and ([.required_status_checks.checks[] | {context, app_id}] | sort_by(.context) == ([{context: "contracts", app_id: 15368}, {context: "Rust workspace", app_id: 15368}, {context: "Desktop renderer", app_id: 15368}, {context: "Task scope (trusted base)", app_id: 15368}] | sort_by(.context))) and (.enforce_admins.enabled == true) and (.required_pull_request_reviews == null) and (.restrictions == null) and (.allow_force_pushes.enabled == false) and (.allow_deletions.enabled == false)' | grep -qx true''',
    '''set -o pipefail; gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/NexusAgentX/flowprobe-studio/actions/permissions --jq '(.enabled == true) and (.allowed_actions == "selected") and (.sha_pinning_required == true)' | grep -qx true''',
    '''set -o pipefail; gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/NexusAgentX/flowprobe-studio/actions/permissions/selected-actions --jq '(.github_owned_allowed == false) and (.verified_allowed == false) and ((.patterns_allowed | sort) == (["actions/checkout@*", "actions/setup-python@*", "actions/setup-node@*", "dtolnay/rust-toolchain@*", "pnpm/action-setup@*"] | sort))' | grep -qx true''',
    '''set -o pipefail; gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/NexusAgentX/flowprobe-studio/actions/permissions/workflow --jq '(.default_workflow_permissions == "read") and (.can_approve_pull_request_reviews == false)' | grep -qx true''',
    '''set -o pipefail; gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' 'repos/NexusAgentX/flowprobe-studio/rules/branches/main?per_page=100' | jq -e '[add[] | select(.type == "pull_request") | .parameters | select(((.required_approving_review_count // 0) > 0) or (.require_code_owner_review // false) or (.require_last_push_approval // false) or (((.required_reviewers // []) | length) > 0))] | length == 0' | grep -qx true''',
    "mise run check",
    "git diff --check origin/main...HEAD",
]
definition_of_done = [
    "The fail-closed unique-merge-base predicate proves that the only changed paths are deletion of the exact authorized base .github/CODEOWNERS blob and mode-100644 updates from the exact authorized base bytes to the exact authorized target bytes for specs/tasks/v0.1/GOV-001.toml and docs/development/TASK_CONTRACT.md",
    "GOV-001 and TASK_CONTRACT.md remove CODEOWNERS ownership, syntax-error, owner-authority and automatic-review assumptions while preserving the exact trusted-base and proposed-head workflow isolation, four app-bound required checks, administrator enforcement, read-only non-approving Actions, and force-push and deletion prohibitions",
    "Official GitHub behavior is recorded accurately: a ready pull request that changes an owned path automatically requests CODEOWNERS review even when approving reviews are not required, and GitHub exposes no repository-level switch that keeps ownership annotations while disabling those automatic requests",
    "The three former CODEOWNERS users remain inside the documented organization-owner or repository-admin trust boundary through live authority evidence, but are no longer assigned as GitHub code owners or requested reviewers by repository content",
    "The GOV-004 delivery creates no new requested-reviewer or review-request timeline event and no submitted review; while the base branch still contains CODEOWNERS, an agent must not open or mark ready a GOV-004 pull request until the user explicitly authorizes a concrete delivery path that creates no new event, and agents do not push directly to main",
    "After merge, a fresh normal non-draft canary pull request with an allowed task-scoped change has empty requested reviewers and submitted reviews at opening and after a second exact head, and its complete timeline contains no review_requested or review_request_removed event",
    "The canary remains blocked until all four current-SHA GitHub Actions app_id 15368 checks succeed on each exact head and then becomes eligible without approval; it is closed unmerged and its branch is deleted after evidence is recorded",
    "No workflow, pull-request template, accepted architecture artifact, implementation, dependency, manifest, lockfile, milestone claim, branch-protection control, Actions permission, or remote setting changes in GOV-004",
    "The task is delivered through its own issue and dedicated branch; its pull request body contains exactly one unquoted Task ID: GOV-004 line if a pull request is used, and an independent reviewer reports P0-P2 zero without submitting a GitHub review or approval",
]
