definition_of_done = [
    "If ARCH-007 selected Windows rows, the crate implements exactly those tuples and returns typed Unsupported for every other release, architecture, helper identity, adapter authority, trust target or consumer tuple; if none was selected, it performs zero OS mutation and the typed Unsupported conformance suite passes",
    "The package is a temporary standalone Cargo workspace with its own committed lockfile, depends only on the neutral BACKEND-001 API plus target-specific libraries, and does not depend on Supervisor or CA lifecycle or modify root workspace files",
    "Every privileged mutation is an allowlisted helper operation with normalized before and after observations, durable intent, stable FlowProbe ownership identity, compare-before-restore, idempotent replay and bounded typed failure",
    "TUN attachment, route and DNS activation, process exclusion, first-packet release, normal stop, helper or engine death, stale owner, restart and boot recovery preserve the ordinary-connectivity oracle under deterministic fault injection",
    "CA install and removal use exact physical store identity, DER fingerprint and selected consumer semantics; broad subject deletion, raw private-key helper access and renderer privilege are impossible",
    "Native calls are behind injectable traits, non-Windows builds compile and test the typed unsupported boundary, and no fake backend can report a real host Ready",
    "No accepted architecture, milestone, unrelated platform backend, compatibility shim, migration layer, requested reviewer or approval is changed or created",
]
