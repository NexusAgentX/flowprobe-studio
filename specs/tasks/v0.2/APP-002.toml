definition_of_done = [
    "Renderer IPC exposes typed intent, capability, progress, recovery and redacted diagnostics only; it cannot submit arbitrary helper operations, paths, commands, private keys, captured credentials or raw trust material",
    "Start remains uncommitted until exact platform, egress, loop-exclusion, UDP or DNS, helper, watchdog and connectivity predicates are Ready; unsupported rows return bounded reasons and never optimistic success",
    "Stop, UI death, runtime death, helper death, lease loss and restart reconcile through the single journal authority and never report Inactive while recovery or owned network state remains unresolved",
    "CA intent is persistent and independent of network-session stop; interception admission requires matching key possession and current installed-trust proof and otherwise follows the explicit pass-through or refusal policy",
    "The desktop makes requested, active, degraded, unsupported and recovery-required states visibly distinct and never relabels a fake or deterministic result as real-host evidence",
    "Focused Rust and renderer tests cover command authorization, secret redaction, concurrent intent, crash recovery and typed unsupported paths without test-only production wiring",
    "Integration changes only dependency wiring, Supervisor orchestration, typed IPC, Tauri commands and renderer state; EGR-001 types and fake, WATCH-001 protocol, journal, watchdog and helper, UPSTREAM-001 engines and every native backend remain unchanged",
    "The helper entrypoint is limited to compile-time target selection and dependency injection of the already implemented BACKEND-001 trait object; it cannot change protocol parsing, authorization, journal, watchdog, recovery or backend behavior",
    "No accepted architecture, milestone claim, compatibility shim, migration layer, requested reviewer or approval is changed or created",
]
