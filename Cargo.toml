[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/ipc",
  "crates/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["wry"] }
ts-rs = { version = "12", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
