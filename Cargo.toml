[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/analyzer-runtime",
  "crates/capture-core",
  "crates/config-compiler",
  "crates/ipc",
  "crates/model",
  "crates/storage",
  "crates/supervisor",
  "plugins/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry"] }
ts-rs = { version = "12", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
