[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/analyzer-runtime",
  "crates/capture-core",
  "crates/config-compiler",
  "crates/ipc",
  "crates/model",
  "crates/runtime-api",
  "crates/storage",
  "crates/supervisor",
  "plugins/demo",
  "runtime/singbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
rcgen = { version = "0.14.9", default-features = false, features = ["ring", "zeroize"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
ts-rs = { version = "12", features = ["serde-compat"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
