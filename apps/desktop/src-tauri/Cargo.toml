[package]
name = "flowprobe-desktop"
description = "Tauri desktop shell for FlowProbe Studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "flowprobe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flowprobe-ipc = { path = "../../../crates/ipc" }
flowprobe-supervisor = { path = "../../../crates/supervisor" }
tauri.workspace = true

[lints]
workspace = true
