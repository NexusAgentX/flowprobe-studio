name: Repository Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate task contracts
        run: python scripts/validate_tasks.py
      - name: Check anti-shortcut quality markers
        run: python scripts/quality_gate.py
      - name: Guard protected architecture changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if echo "$changed" | grep -Eq '^(PRODUCT\.md|ARCHITECTURE\.md|docs/adr/|docs/contracts/)'; then
            if [[ ! "$PR_TITLE" =~ ^(arch:|\[architecture\]) ]]; then
              echo "Protected architecture files changed without an architecture PR title (arch: ...)."
              echo "$changed"
              exit 1
            fi
          fi

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace

  desktop:
    name: Desktop renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint renderer
        run: pnpm --dir apps/desktop lint
      - name: Test renderer
        run: pnpm --dir apps/desktop test
      - name: Build renderer
        run: pnpm --dir apps/desktop build
