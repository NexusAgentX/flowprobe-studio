name: Trusted Task Scope

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  task-scope-trusted-base:
    name: Task scope (trusted base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch and attest the exact pull-request head object
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/flowprobe-pr-head"
          test "$(git rev-parse refs/remotes/origin/flowprobe-pr-head)" = "$HEAD_SHA"
      - name: Enforce task scope using trusted base code and contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -B scripts/check_task_scope.py check
          --event-file "$GITHUB_EVENT_PATH"
          --base-ref "$BASE_SHA"
          --head-ref "$HEAD_SHA"
