[tools]
node = "24.19.0"
pnpm = "11.22.0"
python = "3.12.14"
rust = "1.98.0"

[tasks.bootstrap]
description = "Install locked JavaScript dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."check:contracts"]
description = "Validate task contracts, task scope, and anti-shortcut policy"
run = [
  "python -B scripts/validate_tasks.py",
  "python -B -m unittest discover -s scripts/tests -p 'test_quality_gate.py'",
  "python -B -m unittest discover -s scripts/tests -p 'test_task_scope.py'",
  "python -B scripts/quality_gate.py",
  "python -B scripts/check_task_scope.py audit --ledger specs/nonconformance/v0.1/task-scope.toml",
]

[tasks."check:rust"]
description = "Format, lint, build, and test the Rust workspace"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo check --workspace",
  "cargo test --workspace",
]

[tasks."check:web"]
description = "Lint, test, and build the desktop renderer"
run = [
  "pnpm --dir apps/desktop lint",
  "pnpm --dir apps/desktop test",
  "pnpm --dir apps/desktop build",
]

[tasks.check]
description = "Run the complete local foundation quality gate"
depends = ["check:contracts", "check:rust", "check:web"]

[tasks.dev]
description = "Run the Tauri desktop shell in development mode"
run = "pnpm dev"
